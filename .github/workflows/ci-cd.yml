name: CI

# El despliegue lo hace Vercel con su integración de GitHub (cada push a main; previews en PR).
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

# En PR se cancela la ejecución anterior del mismo ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # prisma.config.ts exige DATABASE_URL al generar el cliente; las pruebas no se conectan a ninguna base.
  DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

jobs:
  test:
    name: Pruebas y compilación
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx prisma generate
      - run: npm run build
      - run: npm test -- --ci
      # Solo la suite de la fase 0: app.e2e-spec.ts es la plantilla de Nest y exige una base de datos real.
      - run: npx jest --config ./test/jest-e2e.json --ci phase0-backend
